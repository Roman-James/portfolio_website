<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tom Koenrades — Roman-James Zeph</title>
  <link rel="stylesheet" href="../../style.css">
</head>

<script src="../../assets/js/theme-toggle.js"></script>
<script src="../../assets/js/music-toggle.js"></script>
<script src="../../assets/js/mouse-trail.js"></script>

<!-- --accent is this project's colour: bars, mouse trail, headings, glows, frames and the photo viewer -->
<body class="project" style="--accent: #9dff6a;">
  <div id="screen">
    <header>
      <div class="header-container">
        <nav>
          <button id="musicToggle" class="btn--image" aria-pressed="false" title="Toggle music">
            <img src="../../assets/images/speaker.gif" alt="Toggle music" class="music-icon">
          </button>
          <a href="../../index.html">[ Roman-James Zeph ] </a>
          <a href="../../projects.html">Projects</a>
          <a href="../../events.html">Events</a>
          <a href="../../about.html">About</a>
          <button id="themeToggle" class="btn--image" aria-pressed="false" title="Toggle light mode">
            <img src="../../assets/images/tv1.gif" alt="Toggle light mode" class="theme-icon">
          </button>
        </nav>
      </div>
    </header>

    <!-- Adding media: put the file in this project's folder, then copy a line like these and change the path:
           <figure class="media-frame"><img class="gallery-img" src="images/photo.jpg" alt="Short description" loading="lazy"><figcaption>Caption</figcaption></figure>
           <figure class="media-frame"><video controls playsinline preload="metadata" src="video/clip.mp4#t=0.1"></video></figure>
         Photos for an event go in the media-grid next to its poster (add one if the event has none yet).
         Paths with spaces need %20 (e.g. 2025-08-16%20kesh%20da%20bus/photo.jpg). -->
    <main class="project-page">
      <h1>Tom Koenrades</h1>
      <div class="project-meta">
        <div class="meta-item"><strong>YEAR:</strong> 2026</div>
        <div class="meta-item"><strong>ROLE:</strong> Album visuals</div>
        <div class="meta-item"><strong>STATUS:</strong> In progress</div>
      </div>
      <div class="project-intro has-media">
        <figure class="media-frame"><img class="gallery-img" src="images/cover.jpg" alt="Tom Koenrades album visual" loading="lazy" data-caption="Tom Koenrades · album visuals (work in progress)"></figure>
        <div class="project-description">
          <p>I’m making the visuals for Tom Koenrades’ upcoming album. This is a work in progress, so more will show up here as it comes together.</p>
        </div>
      </div>
      <div class="media-grid">
        <figure class="media-frame"><img class="gallery-img" src="images/visual-1.jpg" alt="Green visual for Tom Koenrades" loading="lazy" data-caption="Tom Koenrades · album visuals (work in progress)"></figure>
      </div>

      <p class="back-link"><a href="../../projects.html">&larr; Back to projects</a></p>
    </main>

    <div id="galleryOverlay" class="overlay">
      <button id="prevBtn" class="nav-arrow left-arrow" aria-label="Previous image">&#10094;</button>
      <img class="overlay-content" id="overlayImg" src="" alt="">
      <p class="overlay-caption" id="overlayCaption"></p>
      <button id="nextBtn" class="nav-arrow right-arrow" aria-label="Next image">&#10095;</button>
    </div>

    <footer>
      <div class="footer-container">
        <p>&copy; 2026 Roman-James Zeph</p>
      </div>
    </footer>
  </div>
  <script src="../../assets/js/gallery.js"></script>
</body>
</html>
