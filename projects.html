<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
</head>

<script src="assets/js/theme-toggle.js"></script>
<script src="assets/js/music-toggle.js"></script>
<script src="assets/js/mouse-trail.js"></script>


<body>
    <div id="screen">
        <header>
            <div class="header-container">
                <nav>
                    <button id="musicToggle" class="btn--image" aria-pressed="false" title="Toggle music">
                        <img src="assets/images/speaker.gif" alt="Toggle music" class="music-icon">
                    </button>
                    <a href="index.html">[ Roman-James Zeph ] </a>
                    <a href="projects.html">Projects</a>
                    <a href="events.html">Events</a>
                    <a href="about.html">About</a>
                    <button id="themeToggle" class="btn--image" aria-pressed="false" title="Toggle light mode">
                        <img src="assets/images/tv1.gif" alt="Toggle light mode" class="theme-icon">
                    </button>
                </nav>
            </div>
        </header>

        <main>
            <!-- <h2>Projects</h2>
            <p>Click a tile to view project details.</p> -->

            <div class="controls-container">
                    <nav class="filter-nav">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="visuals" style="--accent: #ff5ecf;">Visuals</button>
                        <button class="filter-btn" data-filter="music" style="--accent: #5ce1ff;">Music</button>
                        <button class="filter-btn" data-filter="system" style="--accent: #6dff9e;">System Design</button>
                    </nav>
                    
                    <div class="sort-controls">
                        <label for="sortSelect">Sort by:</label>
                        <select id="sortSelect">
                            <option value="date-new" selected>Newest First</option>
                            <option value="date-old">Oldest First</option>
                            <option value="name-az">Name (A-Z)</option>
                        </select>
                    </div>
                </div>

            <!-- One tile per project.
                   data-category = hub(s), space-separated: visuals / music / system
                   data-date     = used by "sort by date" (YYYY or YYYY-MM-DD)
                   <img src="…"> is the tile picture (leave it out and the tile just shows its title)
                   <span class="tile-tag"> adds a small label in the corner, e.g. for support roles -->
            <div class="projects-grid" id="projectsGrid" aria-label="Projects">
                <a class="project-tile" href="projects/tomkoenrades/" style="--accent: #9dff6a;" data-category="visuals" data-date="2026-09-29" data-name="Tom Koenrades">
                    <img src="projects/tomkoenrades/images/cover.jpg" loading="lazy" alt="Tom Koenrades">
                    <span class="tile-tag">in progress</span>
                    <div class="tile-title">Tom Koenrades</div>
                </a>
                <a class="project-tile" href="projects/kesh/" style="--accent: #ff7a1a;" data-category="visuals" data-date="2026-06-06" data-name="Kesh">
                    <img src="projects/kesh/images/cover.jpg" loading="lazy" alt="Kesh">
                    <div class="tile-title">Kesh</div>
                </a>
                <a class="project-tile" href="projects/tentacles/" style="--accent: #3ff2c8;" data-category="visuals system" data-date="2026-05-30" data-name="Tentacles">
                    <img src="projects/tentacles/images/thumb.jpg" loading="lazy" alt="Tentacles">
                    <div class="tile-title">Tentacles</div>
                </a>
                <a class="project-tile" href="projects/bitcrushfanclub/" style="--accent: #c792ff;" data-category="visuals system" data-date="2026-01-01" data-name="Bitcrush Fanclub">
                    <img src="projects/bitcrushfanclub/images/cover.jpg" loading="lazy" alt="Bitcrush Fanclub">
                    <div class="tile-title">Bitcrush Fanclub</div>
                </a>
                <a class="project-tile" href="projects/awomanisnotborn/" style="--accent: #ff4fd8;" data-category="system visuals" data-date="2026-01-01" data-name="A Woman Is Not Born, She Is Made">
                    <img src="projects/awomanisnotborn/images/thumb.jpg" loading="lazy" alt="">
                    <span class="tile-tag">tech support</span>
                    <div class="tile-title">A Woman Is Not Born, She Is Made</div>
                </a>
                <a class="project-tile" href="projects/music/" style="--accent: #7fb8ff;" data-category="music" data-date="2026-01-01" data-name="My Music">
                    <img src="projects/music/images/cover.jpg" loading="lazy" alt="">
                    <div class="tile-title">My Music</div>
                </a>
                <a class="project-tile" href="projects/lionstorm/" style="--accent: #ff2a2a;" data-category="visuals" data-date="2025-12-11" data-name="Lionstorm">
                    <img src="projects/lionstorm/images/lionstorm.jpg" loading="lazy" alt="Lionstorm">
                    <div class="tile-title">Lionstorm</div>
                </a>
                <a class="project-tile" href="projects/amirthakidambi/" style="--accent: #981bff;" data-category="visuals" data-date="2025-11-08" data-name="Amirtha Kidambi × HKU">
                    <img src="projects/amirthakidambi/images/thumb.jpg" loading="lazy" alt="Amirtha Kidambi × HKU">
                    <div class="tile-title">Amirtha Kidambi × HKU</div>
                </a>
                <a class="project-tile" href="projects/cacherealitymining/" style="--accent: #d4d4d4;" data-category="visuals" data-date="2025-06-26" data-name="Cache: Reality Mining">
                    <img src="projects/cacherealitymining/images/cover.jpg" loading="lazy" alt="Cache: Reality Mining">
                    <div class="tile-title">Cache: Reality Mining</div>
                </a>
                <a class="project-tile" href="projects/cookiedoughrave/" style="--accent: #ff2fb8;" data-category="system visuals" data-date="2025-05-17" data-name="CDrave">
                    <img src="projects/cookiedoughrave/images/cover.jpg" loading="lazy" alt="CDrave">
                    <div class="tile-title">CDrave</div>
                </a>
                <a class="project-tile" href="projects/crazyfrogparty/" style="--accent: #5dff3a;" data-category="visuals music" data-date="2025-09-13" data-name="Crazy Frog Party">
                    <img src="projects/crazyfrogparty/images/cover.jpg" loading="lazy" alt="Crazy Frog Party">
                    <div class="tile-title">Crazy Frog Party</div>
                </a>
                <a class="project-tile" href="projects/gluglu/" style="--accent: #9fe8ff;" data-category="visuals" data-date="2024-12-08" data-name="Glu Glu">
                    <img src="projects/gluglu/images/poster.jpg" loading="lazy" alt="Glu Glu">
                    <div class="tile-title">Glu Glu</div>
                </a>
            </div>
        </main>

        <footer>
            <div class="footer-container">
                <p>&copy; 2026 Roman-James Zeph</p>
            </div>
        </footer>
    </div>
<script src="assets/js/sort.js"></script>
<script src="assets/js/bar-color.js"></script>
</body>
</html>
